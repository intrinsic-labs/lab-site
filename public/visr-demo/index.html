<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>VISR — demo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tycho.css">
  <meta name="theme-color" content="#07090c">
</head>
<body>
  <div id="frame">
    <div id="boot">
      <div class="boot-gate">
        <div class="prompt">TAP TO POWER ON</div>
      </div>
      <div class="boot-panel" aria-hidden="true">
        <div class="boot-meta">
          <div class="boot-box boot-unit boot-flicker">VISR-ID: 42</div>
          <div class="boot-link boot-flicker"></div>
          <div class="boot-box boot-status boot-flicker">STATUS: ACTIVE</div>
        </div>
        <div class="boot-lab boot-flicker">
          <span class="boot-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="boot-lab-name">INTRINSIC LABS</span>
          <span class="boot-rule"></span>
          <span class="boot-six" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
        </div>
        <div class="boot-hero">
          <div class="boot-thanks boot-reveal">Thank you for using</div>
          <div class="boot-red-rule"></div>
          <!-- the wordmark is a drawing, not type: an SVG that fits its width
               exactly, so it is outside the three-size type scale by nature -->
          <svg class="boot-wordmark" viewBox="0 0 1000 150" role="img" aria-label="VISR">
            <text x="500" y="122" font-size="150" text-anchor="middle">VISR</text>
          </svg>
        </div>
        <div class="boot-lower">
          <div class="boot-terminal boot-reveal">
            <span>OPERATOR TERMINAL</span>
            <span class="boot-stages" aria-label="Four initialization stages">
              <i></i><i></i><i></i><i></i>
            </span>
          </div>
          <div class="boot-dots boot-reveal"></div>
          <div class="boot-tagline boot-reveal">
            <i aria-hidden="true"></i>
            <span>Visual Intelligence System: Reconnaissance</span>
            <i aria-hidden="true"></i>
          </div>
        </div>
      </div>
    </div>
    <div id="wake" aria-hidden="true"><i></i></div>
    <div id="main">
      <div id="app"></div>
    </div>
  </div>
  <!-- the kernel, in dependency order: helpers first, the core after the
       services it calls, the extensions after the core they attach to -->
  <!-- DEMO: the mock server, installed before the first request (demo/shim.js) -->

  <script src="demo/shim.js"></script>

  <script src="primitives/ring-scrub.js"></script>
  <script src="primitives/flipcard.js"></script>

  <!-- the REVIEW desk: the wire and memory first, then the pieces, then the

  <script src="review/wire.js"></script>

  <script src="review/link.js"></script>
  <script src="review/attempts.js"></script>
